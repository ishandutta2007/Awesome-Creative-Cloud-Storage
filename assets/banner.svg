<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="glowPulse1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPulse2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      .bg-pulse-1 {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .bg-pulse-2 {
        animation: floatOrb2 10s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: dashMove 25s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulseNode {
        0% { opacity: 0.4; }
        100% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience (Behind text) -->
  <g filter="url(#blurFilter)">
    <circle class="bg-pulse-1" cx="250" cy="120" r="180" fill="url(#glowPulse1)" />
    <circle class="bg-pulse-2" cx="950" cy="300" r="220" fill="url(#glowPulse2)" />
  </g>

  <!-- Tech Grid Background Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Animated Ambient Lines in Background -->
  <g opacity="0.35">
    <path class="dash-flow" d="M -100,100 C 300,50 600,200 1300,80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="dash-flow" d="M -100,320 C 400,380 800,220 1300,340" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Connected Sync Nodes in Background (Dynamic floating feel) -->
  <g class="node-pulse" opacity="0.6">
    <line x1="920" y1="90" x2="1050" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="1050" y1="150" x2="1000" y2="240" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="1000" y1="240" x2="1120" y2="220" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />

    <circle cx="920" cy="90" r="5" fill="#38bdf8" />
    <circle cx="1050" cy="150" r="6" fill="#818cf8" />
    <circle cx="1000" cy="240" r="5" fill="#c084fc" />
    <circle cx="1120" cy="220" r="7" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Unobstructed & Centered / Cleanly Laid Out -->
  <g id="foreground-content">
    <!-- Cloud Creative Icon Badge -->
    <g transform="translate(100, 75)">
      <rect width="56" height="56" rx="14" fill="url(#accentGrad)" opacity="0.25" />
      <rect x="1" y="1" width="54" height="54" rx="13" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <!-- Cloud Icon SVG Path -->
      <path d="M 38 33 A 6 6 0 0 0 38 21 A 11 11 0 0 0 19 23 A 8 8 0 0 0 19 33 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 28 27 L 28 36 M 25 33 L 28 36 L 31 33" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Category Pill -->
    <g transform="translate(170, 88)">
      <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#10b981" />
      <text x="28" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="100" y="185" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Awesome Creative Cloud Storage</text>

    <!-- Subtitle -->
    <text x="100" y="230" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="500">Enterprise File Sync, Self-Hosted Clouds &amp; Creative Asset Workflows</text>

    <!-- Tagline / Description -->
    <text x="100" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400">
      Zero-knowledge EFSS platforms, distributed P2P engines, and self-hosted cloud alternatives compared.
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(100, 315)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="67" y="21" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ SaaS Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(148, 0)">
        <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="72" y="21" fill="#ede9fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Self-Hosted FOSS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(306, 0)">
        <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
        <text x="70" y="21" fill="#fae8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Zero-Knowledge</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(459, 0)">
        <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
        <text x="80" y="21" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎨 Creative Assets</text>
      </g>
    </g>
  </g>
</svg>
